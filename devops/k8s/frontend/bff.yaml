---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peo-bff
  namespace: peo-platform
  labels:
    app: peo-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peo-bff
  template:
    metadata:
      labels:
        app: peo-bff
    spec:     
      containers:
      - name: bff
        image: peo-bff:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_URLS
        # Enable health checks in Kubernetes
        - name: ENABLE_HEALTH_CHECKS
          value: "true"
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: JWT_KEY
        - name: Jwt__Issuer
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_ISSUER_BFF
        - name: Jwt__Audience
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_AUDIENCE_BFF
        - name: Endpoints__Identity
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ENDPOINTS_IDENTITY
        - name: Endpoints__GestaoConteudo
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ENDPOINTS_GESTAOCONTEUDO
        - name: Endpoints__GestaoAlunos
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ENDPOINTS_GESTAOALUNOS
        - name: Endpoints__Faturamento
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ENDPOINTS_FATURAMENTO
        - name: Security__CorsPolicy__AllowedOrigins__0
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: CORS_ALLOWED_ORIGINS_0
        - name: Security__CorsPolicy__AllowedOrigins__1
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: CORS_ALLOWED_ORIGINS_1
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"


---
apiVersion: v1
kind: Service
metadata:
  name: peo-bff
  namespace: peo-platform
  labels:
    app: peo-bff
spec:
  selector:
    app: peo-bff
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    nodePort: 30001
  type: NodePort
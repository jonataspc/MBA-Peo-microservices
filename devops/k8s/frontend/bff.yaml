---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peo-bff
  namespace: peo-platform
  labels:
    app: peo-bff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peo-bff
  template:
    metadata:
      labels:
        app: peo-bff
    spec:     
      # Init container para aguardar todas as APIs estarem prontas
      initContainers:
      - name: wait-for-apis
        image: curlimages/curl:latest
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for Identity API to be ready..."
            until curl -f http://peo-identity-api/health > /dev/null 2>&1; do
              echo "Identity API is not ready yet. Retrying in 5 seconds..."
              sleep 5
            done
            echo "Identity API is ready!"
            
            echo "Waiting for Faturamento API to be ready..."
            until curl -f http://peo-faturamento-api/health > /dev/null 2>&1; do
              echo "Faturamento API is not ready yet. Retrying in 5 seconds..."
              sleep 5
            done
            echo "Faturamento API is ready!"
            
            echo "Waiting for Gestao Alunos API to be ready..."
            until curl -f http://peo-gestaoalunos-api/health > /dev/null 2>&1; do
              echo "Gestao Alunos API is not ready yet. Retrying in 5 seconds..."
              sleep 5
            done
            echo "Gestao Alunos API is ready!"
            
            echo "Waiting for Gestao Conteudo API to be ready..."
            until curl -f http://peo-gestaoconteudo-api/health > /dev/null 2>&1; do
              echo "Gestao Conteudo API is not ready yet. Retrying in 5 seconds..."
              sleep 5
            done
            echo "Gestao Conteudo API is ready!"
            
            echo "All APIs are ready. Starting BFF..."
      containers:
      - name: bff
        image: peo-bff:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_URLS
        # Enable health checks in Kubernetes
        - name: ENABLE_HEALTH_CHECKS
          value: "true"
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: JWT_KEY
        - name: Jwt__Issuer
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_ISSUER_BFF
        - name: Jwt__Audience
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_AUDIENCE_BFF
        - name: Endpoints__Identity
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ENDPOINTS_IDENTITY
        - name: Endpoints__GestaoConteudo
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ENDPOINTS_GESTAOCONTEUDO
        - name: Endpoints__GestaoAlunos
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ENDPOINTS_GESTAOALUNOS
        - name: Endpoints__Faturamento
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ENDPOINTS_FATURAMENTO
        - name: Security__CorsPolicy__AllowedOrigins__0
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: CORS_ALLOWED_ORIGINS_0
        - name: Security__CorsPolicy__AllowedOrigins__1
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: CORS_ALLOWED_ORIGINS_1
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /alive
            port: 80
            scheme: HTTP
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health
            port: 80
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1


---
apiVersion: v1
kind: Service
metadata:
  name: peo-bff
  namespace: peo-platform
  labels:
    app: peo-bff
spec:
  selector:
    app: peo-bff
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    nodePort: 30001
  type: NodePort
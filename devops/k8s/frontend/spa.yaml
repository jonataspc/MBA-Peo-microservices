---
apiVersion: v1
kind: ConfigMap
metadata:
  name: peo-spa-config
  namespace: peo-platform
data:
  # Configuracao especifica para Kubernetes - sobrescreve appsettings.Production.json
  appsettings.Production.json: |
    { "ApiBaseUrl": "http://localhost:30001/" }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peo-frontend
  namespace: peo-platform
  labels:
    app: peo-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peo-frontend
  template:
    metadata:
      labels:
        app: peo-frontend
    spec:
      # Init container para aguardar BFF estar pronto
      initContainers:
      - name: wait-for-bff
        image: curlimages/curl:latest
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for BFF to be ready..."
            until curl -f http://peo-bff/health > /dev/null 2>&1; do
              echo "BFF is not ready yet. Retrying in 5 seconds..."
              sleep 5
            done
            echo "BFF is ready! Starting Frontend..."
      containers:
      - name: frontend
        image: peo-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        # Monta o ConfigMap para sobrescrever appsettings.Production.json em runtime
        # Isso permite que o mesmo container funcione em Docker Compose (porta 5000) 
        # e Kubernetes (porta 30001) sem rebuild
        - name: spa-config
          mountPath: /usr/share/nginx/html/appsettings.Production.json
          subPath: appsettings.Production.json
          readOnly: true
 
      volumes:
      - name: spa-config
        configMap:
          name: peo-spa-config
          items:
          - key: appsettings.Production.json
            path: appsettings.Production.json

---
apiVersion: v1
kind: Service
metadata:
  name: peo-frontend
  namespace: peo-platform
  labels:
    app: peo-frontend
spec:
  selector:
    app: peo-frontend
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    nodePort: 30000
  type: NodePort
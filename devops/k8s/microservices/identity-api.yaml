---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peo-identity-api
  namespace: peo-platform
  labels:
    app: peo-identity-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peo-identity-api
  template:
    metadata:
      labels:
        app: peo-identity-api
    spec:
      # Init containers para aguardar dependências
      initContainers:
      - name: wait-for-sqlserver
        image: mcr.microsoft.com/mssql-tools:latest
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for Identity SQL Server to be ready..."
            until /opt/mssql-tools/bin/sqlcmd -S peo-identity-sqlserver -U sa -P "${SA_PASSWORD}" -C -Q "SELECT 1" -l 30 -t 30 > /dev/null 2>&1; do
              echo "Identity SQL Server is not ready yet. Retrying in 5 seconds..."
              sleep 5
            done
            echo "Identity SQL Server is ready!"
        env:
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: SA_PASSWORD            
      - name: wait-for-rabbitmq
        image: busybox:1.35
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for RabbitMQ to be ready..."
            until nc -z peo-rabbitmq 5672; do
              echo "RabbitMQ is not ready yet. Retrying in 3 seconds..."
              sleep 3
            done
            echo "RabbitMQ is ready!"
            echo "All dependencies are ready. Starting Identity API..."
      containers:
      - name: identity-api
        image: peo-identity-api:latest
        imagePullPolicy: Never  # Para desenvolvimento local
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_URLS
        # Enable database migrations in Kubernetes
        - name: ENABLE_MIGRATIONS
          value: "true"
        # Enable health checks in Kubernetes
        - name: ENABLE_HEALTH_CHECKS
          value: "true" 
        # Database configuration
        - name: ConnectionStrings__identity-db
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: IDENTITY_CONNECTION_STRING
        # RabbitMQ configuration
        - name: ConnectionStrings__messaging
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: RABBITMQ_CONNECTION_STRING
        # JWT configuration
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: JWT_KEY
        - name: Jwt__Issuer
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_ISSUER_IDENTITY
        - name: Jwt__Audience
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_AUDIENCE_IDENTITY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        

---
apiVersion: v1
kind: Service
metadata:
  name: peo-identity-api
  namespace: peo-platform
  labels:
    app: peo-identity-api
spec:
  selector:
    app: peo-identity-api
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peo-gestaoconteudo-api
  namespace: peo-platform
  labels:
    app: peo-gestaoconteudo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peo-gestaoconteudo-api
  template:
    metadata:
      labels:
        app: peo-gestaoconteudo-api
    spec:
      # Init containers para aguardar dependências
      initContainers:
      - name: wait-for-sqlserver
        image: mcr.microsoft.com/mssql-tools:latest
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for Gestao Conteudo SQL Server to be ready..."
            until /opt/mssql-tools/bin/sqlcmd -S peo-gestaoconteudo-sqlserver -U sa -P "${SA_PASSWORD}" -Q "select 1" -C -N -l 1 -t 1 > /dev/null 2>&1; do
              echo "Gestao Conteudo SQL Server is not ready yet. Retrying in 5 seconds..."
              sleep 5
            done
            echo "Gestao Conteudo SQL Server is ready!"
        env:
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: SA_PASSWORD            
      - name: wait-for-rabbitmq
        image: busybox:1.35
        command: ['sh', '-c']
        args:
          - |
            echo "Waiting for RabbitMQ to be ready..."
            until nc -z peo-rabbitmq 5672; do
              echo "RabbitMQ is not ready yet. Retrying in 3 seconds..."
              sleep 3
            done
            echo "RabbitMQ is ready!"
            echo "All dependencies are ready. Starting Gestao Conteudo API..."
      containers:
      - name: gestaoconteudo-api
        image: peo-gestaoconteudo-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_URLS
        # Enable database migrations in Kubernetes
        - name: ENABLE_MIGRATIONS
          value: "true"
        # Enable health checks in Kubernetes
        - name: ENABLE_HEALTH_CHECKS
          value: "true"
        # Database configuration
        - name: ConnectionStrings__gestao-conteudo-db
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: GESTAOCONTEUDO_CONNECTION_STRING
        # RabbitMQ configuration
        - name: ConnectionStrings__messaging
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: RABBITMQ_CONNECTION_STRING
        # JWT configuration
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: JWT_KEY
        - name: Jwt__Issuer
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_ISSUER_GESTAOCONTEUDO
        - name: Jwt__Audience
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_AUDIENCE_GESTAOCONTEUDO
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /alive
            port: 80
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health
            port: 80
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1


---
apiVersion: v1
kind: Service
metadata:
  name: peo-gestaoconteudo-api
  namespace: peo-platform
  labels:
    app: peo-gestaoconteudo-api
spec:
  selector:
    app: peo-gestaoconteudo-api
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
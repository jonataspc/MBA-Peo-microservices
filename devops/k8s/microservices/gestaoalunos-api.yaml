---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peo-gestaoalunos-api
  namespace: peo-platform
  labels:
    app: peo-gestaoalunos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peo-gestaoalunos-api
  template:
    metadata:
      labels:
        app: peo-gestaoalunos-api
    spec:      
      containers:
      - name: gestaoalunos-api
        image: peo-gestaoalunos-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: ASPNETCORE_URLS
        # Enable database migrations in Kubernetes
        - name: ENABLE_MIGRATIONS
          value: "true"
        # Enable health checks in Kubernetes
        - name: ENABLE_HEALTH_CHECKS
          value: "true"
        # Database configuration
        - name: ConnectionStrings__gestao-alunos-db
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: GESTAOALUNOS_CONNECTION_STRING
        # RabbitMQ configuration
        - name: ConnectionStrings__messaging
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: RABBITMQ_CONNECTION_STRING
        # JWT configuration
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: JWT_KEY
        - name: Jwt__Issuer
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_ISSUER_GESTAOALUNOS
        - name: Jwt__Audience
          valueFrom:
            configMapKeyRef:
              name: peo-config
              key: JWT_AUDIENCE_GESTAOALUNOS
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"


---
apiVersion: v1
kind: Service
metadata:
  name: peo-gestaoalunos-api
  namespace: peo-platform
  labels:
    app: peo-gestaoalunos-api
spec:
  selector:
    app: peo-gestaoalunos-api
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  type: ClusterIP
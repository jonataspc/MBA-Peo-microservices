# ==============================================================================
# SEPARATE SQL SERVER INSTANCES FOR MICROSERVICES
# ==============================================================================
# 
# This configuration implements the "Database per Service" pattern where each 
# microservice has its own dedicated SQL Server instance for complete isolation
#
# Benefits:
# - Complete data isolation between services
# - Independent scaling per service  
# - Fault isolation - one DB failure doesn't affect others
# - Technology flexibility for future migrations
# - Enhanced security boundaries
#
# ==============================================================================

---
# IDENTITY SQL SERVER INSTANCE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: peo-identity-sqlserver
  namespace: peo-platform
  labels:
    app: peo-identity-sqlserver
    service: identity
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: peo-identity-sqlserver
  template:
    metadata:
      labels:
        app: peo-identity-sqlserver
        service: identity
        tier: database
    spec:
      containers:
      - name: sqlserver
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
        - containerPort: 1433
        env:
        - name: SA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: peo-secrets
              key: SA_PASSWORD
        - name: ACCEPT_EULA
          value: "Y"
        - name: MSSQL_PID
          value: "Express"
        - name: MSSQL_COLLATION
          value: "SQL_Latin1_General_CP1_CI_AS"
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: identity-sqlserver-data
          mountPath: /var/opt/mssql
        livenessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -Q "SELECT 1 AS HealthCheck" -C -N -l 1 -b
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -c
            - |
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SA_PASSWORD}" -Q "SELECT 1 AS HealthCheck" -C -N -l 1 -b
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: identity-sqlserver-data
        persistentVolumeClaim:
          claimName: identity-sqlserver-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: peo-identity-sqlserver
  namespace: peo-platform
  labels:
    app: peo-identity-sqlserver
    service: identity
    tier: database
spec:
  selector:
    app: peo-identity-sqlserver
  ports:
  - port: 1433
    targetPort: 1433
    protocol: TCP
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: identity-sqlserver-pvc
  namespace: peo-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# External access for development/debugging
apiVersion: v1
kind: Service
metadata:
  name: peo-identity-sqlserver-external
  namespace: peo-platform
  labels:
    app: peo-identity-sqlserver
    service: identity
    tier: database
spec:
  selector:
    app: peo-identity-sqlserver
  ports:
  - port: 1433
    targetPort: 1433
    nodePort: 31433
    protocol: TCP
  type: NodePort


services:
  # ===============================
  # SQL Server Instances - Development Overrides
  # ===============================

  identity-sqlserver:
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    ports:
      - "1433:1433"

  faturamento-sqlserver:
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    ports:
      - "1434:1433"

  gestao-alunos-sqlserver:
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    ports:
      - "1435:1433"

  gestao-conteudo-sqlserver:
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_COLLATION: "SQL_Latin1_General_CP1_CI_AS"
    ports:
      - "1436:1433"

  # ===============================
  # Development Overrides
  # ===============================

  peo-identity-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug
      Logging__LogLevel__Microsoft.AspNetCore: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Information
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  peo-gestaoconteudo-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug
      Logging__LogLevel__Microsoft.AspNetCore: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Information
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  peo-gestaoalunos-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug
      Logging__LogLevel__Microsoft.AspNetCore: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Information
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  peo-faturamento-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug
      Logging__LogLevel__Microsoft.AspNetCore: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Information
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Information
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro

  peo-bff:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug
      Logging__LogLevel__Microsoft.AspNetCore: Information
      Security__CorsPolicy__AllowedOrigins__0: "http://localhost:3000"
      Security__CorsPolicy__AllowedOrigins__1: "https://localhost:7031"
      Security__CorsPolicy__AllowedOrigins__2: "http://localhost:5251"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro